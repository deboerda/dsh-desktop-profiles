# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: mcp-dsh-computer-use-win
  config:
    serverName: wincu
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/dsh-computer-use-win/mcp/server.mjs', baseUrl))"
    toolCallTimeoutMs: 60000
    failOnStartupError: false

- insert:
    - id: win-job-runner-fix
      name: dsh-win-job-runner-fix

- id: token-saver
  config:
    slimSchemas: true
    deferFamilies: true
    slimCordisPrompt: true
    compactRuntimeTool: true
    deferUnlisted: true
    maxDescriptionChars: 80

- id: agent-presets
  config:
    default: local-qwen-app
    includeShippedRoot: true
    includeUserRoot: true
    roots: []

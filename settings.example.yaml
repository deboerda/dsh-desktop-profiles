# Copy to %USERPROFILE%\.dsh\settings.yaml if you do not already have one.
# Do not put API keys here. Store them in %USERPROFILE%\.dsh\.credentials.yaml
# (see restore.ps1 comments).

ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-presets:
  default: cordis
agent-default-model:
  provider: xai
  model: grok-4.6
llm-pi-ai:
  providers:
    tongyuan:
      displayName: Tongyuan
      api: openai-completions
      baseURL: https://copilot-dev.tongyuan.cc/api/openai/v1
      apiKeyEnv: TONGYUAN_API_KEY
      timeoutMs: 600000
      streamIdleTimeoutMs: 300000
      defaultContextWindow: 262144
      defaultMaxTokens: 32768
      defaultInput:
        - text
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsReasoningEffort: false
        maxTokensField: max_tokens
        supportsStrictMode: false
        supportsLongCacheRetention: false
      models:
        - id: grok-4.6
          name: Grok 4.6
        - id: gpt-5.6-luna
          name: GPT-5.6 Luna
        - id: qwen-3.8-max
          name: Qwen 3.8 Max
        - id: claude-haiku-4.5
          name: Claude Haiku 4.5
        - id: claude-opus-5
          name: Claude Opus 5
        - id: claude-sonnet-5
          name: Claude Sonnet 5
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
        - id: deepseek-v4-flash-vision-exp
          name: DeepSeek V4 Flash Vision Exp
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
        - id: glm-5.3
          name: GLM-5.3
        - id: glm-5.3-flash
          name: GLM-5.3 Flash
        - id: gpt-5.6-sol
          name: GPT-5.6 Sol
        - id: gpt-5.6-terra
          name: GPT-5.6 Terra
        - id: kimi-k3
          name: Kimi K3
        - id: minimax-m2.7
          name: MiniMax M2.7
dsh-desktop:
  mode: compatibility
  macosMaterial: transparent
  windowsMaterial: off
  openBrowser: true
  networkExposure: loopback
dsh-desktop-notifications:
  enabled: true
  notifyOnTurnCompletion: true
  notifyOnTurnFailure: true
  notifyOnJobCompletion: true
  notifyOnJobFailure: true

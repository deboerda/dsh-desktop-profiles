# Copy/merge into %DSH_HOME%/settings.yaml. No API keys here.
# Secrets go in .credentials.yaml (see restore.ps1).

ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-presets:
  default: local-qwen-app
agent-default-model:
  provider: local-qwen
  model: qwen3.6-35b-a3b-iq4xs
llm-pi-ai:
  providers:
    tongyuan:
      displayName: Tongyuan
      api: openai-completions
      baseURL: https://copilot-dev.tongyuan.cc/api/openai/v1
      apiKeyEnv: TONGYUAN_API_KEY
      timeoutMs: 600000
      streamIdleTimeoutMs: 300000
      defaultContextWindow: 262144
      defaultMaxTokens: 32768
      defaultInput:
        - text
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsReasoningEffort: false
        maxTokensField: max_tokens
        supportsStrictMode: false
        supportsLongCacheRetention: false
      models:
        - id: grok-4.6
          name: Grok 4.6
        - id: gpt-5.6-luna
          name: GPT-5.6 Luna
        - id: qwen-3.8-max
          name: Qwen 3.8 Max
        - id: claude-haiku-4.5
          name: Claude Haiku 4.5
        - id: claude-opus-5
          name: Claude Opus 5
        - id: claude-sonnet-5
          name: Claude Sonnet 5
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash
        - id: deepseek-v4-flash-vision-exp
          name: DeepSeek V4 Flash Vision Exp
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro
        - id: glm-5.3
          name: GLM-5.3
        - id: glm-5.3-flash
          name: GLM-5.3 Flash
        - id: gpt-5.6-sol
          name: GPT-5.6 Sol
        - id: gpt-5.6-terra
          name: GPT-5.6 Terra
        - id: kimi-k3
          name: Kimi K3
        - id: minimax-m2.7
          name: MiniMax M2.7
    local-qwen:
      displayName: Local Qwen3.6 (llama.cpp)
      api: openai-completions
      baseURL: http://127.0.0.1:8080/v1
      apiKeyEnv: LOCAL_QWEN_API_KEY
      timeoutMs: 600000
      streamIdleTimeoutMs: 300000
      defaultContextWindow: 32768
      defaultMaxTokens: 8192
      defaultInput:
        - text
      compat:
        supportsStore: false
        supportsDeveloperRole: false
        supportsReasoningEffort: false
        maxTokensField: max_tokens
        supportsStrictMode: false
        supportsLongCacheRetention: false
        thinkingFormat: qwen-chat-template
        requiresThinkingAsText: true
        chatTemplateKwargs:
          enable_thinking: false
      models:
        - id: qwen3.6-35b-a3b-iq4xs
          name: Qwen3.6 35B-A3B IQ4_XS (32K local)
          reasoningEfforts: false
dsh-desktop:
  mode: compatibility
  macosMaterial: transparent
  windowsMaterial: off
  openBrowser: true
  networkExposure: loopback
dsh-desktop-notifications:
  enabled: true
  notifyOnTurnCompletion: true
  notifyOnTurnFailure: true
  notifyOnJobCompletion: true
  notifyOnJobFailure: true
dsh-community-market:
  sources:
    - sourceRecordId: builtin-dshfind
      registrationKind: built-in
      adapterId: market.dshfind-v1
      providerId: com.dshfind.catalog
      builtInProviderKey: dshfind
      enabled: true
      order: 0
    - sourceRecordId: builtin-dsh-1024store
      registrationKind: built-in
      adapterId: market.dsh-1024store-v2
      providerId: com.deepseek1024.catalog
      builtInProviderKey: dsh-1024store
      enabled: false
